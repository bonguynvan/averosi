# Local infrastructure: Postgres + Redis for the TypeScript worker and web, plus the Go ingestor
# (realtime prices + candles for the whole universe). Host ports avoid clashing with other projects.
name: market-infra
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: market
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d market"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  ingestor:
    build: ./services/ingestor
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/market
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:58090:8090"] # GET /healthz
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 128m
volumes:
  pgdata:
