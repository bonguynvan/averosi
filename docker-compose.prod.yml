# Production stack for a single 4 GB VPS. Memory limits sum to ~2.4 GB, leaving room for the OS,
# Docker and page cache. Images are built by GitHub Actions (.github/workflows/images.yml) and pulled.
#
#   cp docker/prod.env.example .env   # fill in, never commit
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# Only Caddy publishes ports. Postgres, Redis and the ingestor health endpoint stay on the internal network.
name: market-prod

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/bonguynvan/averosi-app:latest}
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    mem_limit: 96m

  web:
    <<: *app
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/market
      REDIS_URL: redis://redis:6379/0
      MARKET_BACKEND: store
      NODE_OPTIONS: --max-old-space-size=512
    mem_limit: 768m

  worker:
    <<: *app
    working_dir: /worker
    command: ["node_modules/.bin/tsx", "src/main.ts"]
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/market
      REDIS_URL: redis://redis:6379/0
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 384m

  ingestor:
    image: ${INGESTOR_IMAGE:-ghcr.io/bonguynvan/averosi-ingestor:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/market
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 128m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: market
    # Sized for ~1 GB: small shared_buffers, few connections (web 5 + worker 5 + ingestor 4).
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=8MB
      -c maintenance_work_mem=64MB -c max_connections=40 -c wal_compression=on
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d market"]
      interval: 5s
      retries: 10
    shm_size: 128m
    mem_limit: 896m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache and pub/sub only: nothing here needs to survive a restart.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    mem_limit: 192m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
